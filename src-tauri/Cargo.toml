[package]
name = "pot"
version = "0.0.0"
description = "Pot App"
authors = ["pot-app"]
license = "GPL-3.0-only"
repository = "https://github.com/zjjxwhh/pot-desktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

tauri = { version = "2", features = [ "protocol-asset", "tray-icon", "image-png", "image-ico", "devtools", "macos-private-api"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-store = "2.4.4"
tauri-plugin-log = "2.9.0"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-websocket = "2.4.2"
tauri-plugin-updater = "2.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0.0"
once_cell = "1.21.4"
mouse_position = "0.1.4"
log = "0.4"
tiny_http = "0.12.0"
screenshots = "0.8.10"
base64 = "0.23"
arboard = "3.6"
lingua = { version = "1.8.0", default-features = false, features = ["chinese", "japanese", "english", "korean", "french", "spanish", "german", "russian", "italian", "portuguese", "turkish", "arabic", "vietnamese", "thai", "indonesian", "malay", "hindi", "mongolian", "persian", "nynorsk", "bokmal", "ukrainian"] }
reqwest = { version = "0.13", features = ["json"] }
reqwest_dav = "0.3.3"
rust-s3 = { version = "0.37", features = ["fail-on-err"] }
zip = "8.6.0"
walkdir = "2.5"
thiserror = "2.0"
font-kit = "0.14.3"
image = "0.25.10"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"
accessibility-ng = "0.1.6"
accessibility-sys-ng = "0.1.3"
core-foundation = "0.9.4"

[target.'cfg(windows)'.dependencies]
windows = {version="0.62.2",features= ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Graphics_Imaging", "Media_Ocr", "Foundation", "Globalization", "Storage", "Storage_Streams", "Win32_System_Com", "Win32_System_DataExchange", "Win32_UI_Accessibility"] }
enigo = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
#openssl
x11-clipboard = "0.9.3"
wl-clipboard-rs = "0.9.3"
